<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carteira Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="topo">
        <div class="logo">CD</div>
        <div>
          <h1>Carteira Digital</h1>
          <p class="aviso">Simulação com dados fictícios</p>
        </div>
      </header>

      <section class="card">
        <label for="seletor-usuario">Quem é você?</label>
        <select id="seletor-usuario"></select>
        <button type="button" id="btn-cadastro" class="btn-link">
          + Criar nova conta
        </button>
      </section>

      <section class="cartao-saldo">
        <p>Saldo disponível</p>
        <h2 id="saldo">R$ --</h2>
        <button type="button" id="btn-deposito" class="btn-deposito">
          + Adicionar saldo
        </button>
      </section>
      <section class="cartao-banco">
        <div class="cartao-topo">
          <div class="chip"></div>
          <svg
            class="contactless"
            viewBox="0 0 24 24"
            width="26"
            height="26"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M8 8c2 2.5 2 5.5 0 8" />
            <path d="M12 5c3.5 4 3.5 10 0 14" />
            <path d="M16 2c5 5.5 5 14.5 0 20" />
          </svg>
        </div>

        <p class="numero" id="cartao-numero">•••• •••• •••• ••••</p>

        <div class="cartao-base">
          <div>
            <small>Titular</small>
            <p id="cartao-nome">SELECIONE UM USUÁRIO</p>
          </div>
          <div class="marca">CD</div>
        </div>
      </section>
      <form id="form-transferencia" class="card">
        <h3>Transferir por chave Pix</h3>

        <label for="chave">Chave Pix do destinatário</label>
        <input
          type="text"
          id="chave"
          placeholder="bruno@exemplo.com"
          required
        />

        <label for="valor">Valor (R$)</label>
        <input
          type="number"
          id="valor"
          min="0.01"
          step="0.01"
          placeholder="0,00"
          required
        />

        <button type="submit" id="botao">Transferir</button>
        <p id="mensagem" class="mensagem"></p>
      </form>

      <section class="card">
        <h3>Extrato</h3>

        <div class="filtros">
          <div class="abas">
            <button type="button" class="aba ativa" data-tipo="todas">
              Todas
            </button>
            <button type="button" class="aba" data-tipo="entradas">
              Entradas
            </button>
            <button type="button" class="aba" data-tipo="saidas">Saídas</button>
          </div>
          <select id="filtro-periodo">
            <option value="tudo">Todo o período</option>
            <option value="7">Últimos 7 dias</option>
            <option value="30">Últimos 30 dias</option>
          </select>
        </div>

        <ul id="extrato"></ul>
      </section>
    </main>
    <dialog id="modal">
      <div id="modal-conteudo"></div>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
  </body>
</html>
